aid: linas-matkasse
name: Linas Matkasse
description: 'Linas Matkasse is a Swedish meal-kit subscription service that delivers pre-portioned
  ingredients and nutritionally calculated recipes to customers'' homes each week. Customers pick from
  more than 150 weekly recipes across concepts such as Chef''s Choice, Family Favorites, Quick & Easy,
  Calorie-Smart, Vegetarian, Gluten-Free and Lactose-Free, and can change their selection until Tuesday
  night before a Saturday-to-Monday delivery. The brand is operated by Cheffelo, a Scandinavian meal-kit
  group listed on Nasdaq First North Growth Market that also runs Godtlevert in Norway and RetNemt in
  Denmark and delivers roughly 17 million meals a year. Linas Matkasse runs a consumer subscription
  e-commerce storefront and a "Mina Sidor" customer account area; it publishes no public developer
  portal, API documentation, or SDKs.'
